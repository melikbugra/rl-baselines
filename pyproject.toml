[tool.poetry]
name = "rl-baselines"
version = "0.1.0"
description = "RL baseline algorithms"
authors = ["melikbugra <melikbugraozcelik@gmail.com>"]
license = "MIT LICENSE"

[tool.poetry.dependencies]
python = ">=3.10"
gymnasium = ">=1.1"
matplotlib = "^3.9.2"
mlflow = "^2.17.2"
numpy = "^2"
prettytable = "^3.9.0"
torch = "^2.5.1"
opencv-python = ">=4.8,<4.10"
optuna = "^4.1.0"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
